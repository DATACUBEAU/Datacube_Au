name: datacube_au
description: DataCube AU native mobile foundation.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.1 # Temporary until the existing job store is migrated to Drift.
  path: ^1.9.0
  path_provider: ^2.1.6
  workmanager: ^0.9.3
  flutter_local_notifications: ^19.5.0
  connectivity_plus: ^6.1.2
  uuid: ^4.5.1
  logging: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.16.2
flutter:
  uses-material-design: true
