name: One-shot model archive bounds hardening

on:
  push:
    branches:
      - automation/worker-lease-fencing-20260911
    paths:
      - .github/workflows/one-shot-model-archive-bounds.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/worker-lease-fencing-20260911
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/rag-worker/package-lock.json

      - name: Patch bounded model archive bootstrap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('backend/rag-worker/src/ingestion.ts')
          source = source_path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              "  private modelLockTimeoutMs: number;\n  private modelLockStaleMs: number;\n  private transformersFallbackEnabled: boolean;",
              "  private modelLockTimeoutMs: number;\n  private modelLockStaleMs: number;\n  private modelArchiveMaxBytes: number;\n  private modelArchiveMaxExpandedBytes: number;\n  private modelArchiveMaxRedirects: number;\n  private transformersFallbackEnabled: boolean;",
          )

          replace_once(
              "    this.modelLockTimeoutMs = this.parsePositiveInt(process.env.FASTEMBED_MODEL_LOCK_TIMEOUT_MS, 120000);\n    this.modelLockStaleMs = this.parsePositiveInt(process.env.FASTEMBED_MODEL_LOCK_STALE_MS, 600000);\n    const fallbackRaw = String(process.env.TRANSFORMERS_FALLBACK_ENABLED ?? process.env.ENABLE_TRANSFORMERS_FALLBACK ?? 'true').toLowerCase();",
              "    this.modelLockTimeoutMs = this.parsePositiveInt(process.env.FASTEMBED_MODEL_LOCK_TIMEOUT_MS, 120000);\n    this.modelLockStaleMs = this.parsePositiveInt(process.env.FASTEMBED_MODEL_LOCK_STALE_MS, 600000);\n    this.modelArchiveMaxBytes = this.parsePositiveInt(process.env.FASTEMBED_MODEL_ARCHIVE_MAX_BYTES, 512 * 1024 * 1024);\n    this.modelArchiveMaxExpandedBytes = this.parsePositiveInt(process.env.FASTEMBED_MODEL_ARCHIVE_MAX_EXPANDED_BYTES, 2 * 1024 * 1024 * 1024);\n    this.modelArchiveMaxRedirects = Math.min(10, this.parsePositiveInt(process.env.FASTEMBED_MODEL_ARCHIVE_MAX_REDIRECTS, 5));\n    const fallbackRaw = String(process.env.TRANSFORMERS_FALLBACK_ENABLED ?? process.env.ENABLE_TRANSFORMERS_FALLBACK ?? 'true').toLowerCase();",
          )

          replace_once(
              "  private async isValidGzip(filePath: string): Promise<boolean> {\n    if (!fs.existsSync(filePath)) return false;\n    try {\n      await pipeline(\n        fs.createReadStream(filePath),\n        zlib.createGunzip(),\n        new Writable({\n          write(_chunk, _encoding, callback) {\n            callback();\n          },\n        }),\n      );\n      return true;\n    } catch {\n      return false;\n    }\n  }",
              "  private async isValidGzip(filePath: string): Promise<boolean> {\n    if (!fs.existsSync(filePath)) return false;\n    let expandedBytes = 0;\n    const maxExpandedBytes = this.modelArchiveMaxExpandedBytes;\n    try {\n      await pipeline(\n        fs.createReadStream(filePath),\n        zlib.createGunzip(),\n        new Writable({\n          write(chunk, _encoding, callback) {\n            expandedBytes += Buffer.byteLength(chunk);\n            if (expandedBytes > maxExpandedBytes) {\n              callback(new Error(`FastEmbed model archive exceeds decompressed size limit of ${maxExpandedBytes} bytes`));\n              return;\n            }\n            callback();\n          },\n        }),\n      );\n      return true;\n    } catch {\n      return false;\n    }\n  }",
          )

          replace_once(
              "  private async downloadToTempFile(url: string, tempPath: string): Promise<DownloadInfo> {\n    const headers = { 'User-Agent': 'DatacubeAU-RAGWorker/1.0' };\n\n    return new Promise((resolve, reject) => {\n      const request = https.get(url, { headers }, (response) => {",
              "  private async downloadToTempFile(url: string, tempPath: string, redirectCount = 0): Promise<DownloadInfo> {\n    const headers = { 'User-Agent': 'DatacubeAU-RAGWorker/1.0' };\n    const parsedUrl = new URL(url);\n    if (parsedUrl.protocol !== 'https:') {\n      throw new Error(`Refusing non-HTTPS model archive URL: ${parsedUrl.protocol}`);\n    }\n\n    return new Promise((resolve, reject) => {\n      const request = https.get(parsedUrl, { headers }, (response) => {",
          )

          replace_once(
              "        ) {\n          response.resume();\n          void this.downloadToTempFile(response.headers.location, tempPath).then(resolve).catch(reject);\n          return;\n        }",
              "        ) {\n          if (redirectCount >= this.modelArchiveMaxRedirects) {\n            response.resume();\n            reject(new Error(`FastEmbed model archive redirect limit exceeded (${this.modelArchiveMaxRedirects})`));\n            return;\n          }\n\n          let redirectUrl: URL;\n          try {\n            redirectUrl = new URL(response.headers.location, parsedUrl);\n          } catch {\n            response.resume();\n            reject(new Error('FastEmbed model archive redirect returned an invalid Location header'));\n            return;\n          }\n\n          if (redirectUrl.protocol !== 'https:') {\n            response.resume();\n            reject(new Error(`Refusing non-HTTPS model archive redirect: ${redirectUrl.protocol}`));\n            return;\n          }\n\n          response.resume();\n          void this.downloadToTempFile(redirectUrl.toString(), tempPath, redirectCount + 1).then(resolve).catch(reject);\n          return;\n        }",
          )

          replace_once(
              "        const out = fs.createWriteStream(tempPath);\n        let bytes = 0;",
              "        const contentLength = Number(response.headers['content-length'] || 0);\n        if (Number.isFinite(contentLength) && contentLength > this.modelArchiveMaxBytes) {\n          response.resume();\n          reject(new Error(`FastEmbed model archive exceeds compressed size limit of ${this.modelArchiveMaxBytes} bytes`));\n          return;\n        }\n\n        const out = fs.createWriteStream(tempPath);\n        let bytes = 0;",
          )

          replace_once(
              "        response.on('data', (chunk: Buffer) => {\n          bytes += chunk.length;\n          if (firstBytes.length < 8) {",
              "        response.on('data', (chunk: Buffer) => {\n          bytes += chunk.length;\n          if (bytes > this.modelArchiveMaxBytes) {\n            const sizeError = new Error(`FastEmbed model archive exceeds compressed size limit of ${this.modelArchiveMaxBytes} bytes`);\n            response.unpipe(out);\n            response.destroy(sizeError);\n            out.destroy(sizeError);\n            return;\n          }\n          if (firstBytes.length < 8) {",
          )

          source_path.write_text(source)

          test_path = Path('backend/rag-worker/tests/model-archive-bounds.test.ts')
          test_path.write_text("""import fs from 'fs';\nimport path from 'path';\n\ndescribe('FastEmbed model archive bootstrap safety', () => {\n  const source = fs.readFileSync(path.join(__dirname, '..', 'src', 'ingestion.ts'), 'utf8');\n\n  it('bounds redirects and requires HTTPS across redirect hops', () => {\n    expect(source).toContain('FASTEMBED_MODEL_ARCHIVE_MAX_REDIRECTS');\n    expect(source).toContain('redirectCount >= this.modelArchiveMaxRedirects');\n    expect(source).toContain("parsedUrl.protocol !== 'https:'");\n    expect(source).toContain("redirectUrl.protocol !== 'https:'");\n    expect(source).toContain('new URL(response.headers.location, parsedUrl)');\n  });\n\n  it('bounds compressed archive downloads using header and streamed byte checks', () => {\n    expect(source).toContain('FASTEMBED_MODEL_ARCHIVE_MAX_BYTES');\n    expect(source).toContain("response.headers['content-length']");\n    expect(source).toContain('contentLength > this.modelArchiveMaxBytes');\n    expect(source).toContain('bytes > this.modelArchiveMaxBytes');\n    expect(source).toContain('response.unpipe(out)');\n  });\n\n  it('bounds decompressed gzip validation work', () => {\n    expect(source).toContain('FASTEMBED_MODEL_ARCHIVE_MAX_EXPANDED_BYTES');\n    expect(source).toContain('expandedBytes += Buffer.byteLength(chunk)');\n    expect(source).toContain('expandedBytes > maxExpandedBytes');\n  });\n});\n""")
          PY

      - name: Install backend worker
        run: npm ci --prefix backend/rag-worker

      - name: Build backend worker
        run: npm run build --prefix backend/rag-worker

      - name: Test backend worker
        run: npm test --prefix backend/rag-worker -- --runInBand

      - name: Enforce critical production dependency audit
        run: npm audit --prefix backend/rag-worker --omit=dev --audit-level=critical

      - name: Commit validated hardening and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "datacube-hardening-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-model-archive-bounds.yml
          git add backend/rag-worker/src/ingestion.ts backend/rag-worker/tests/model-archive-bounds.test.ts
          git commit -m "security(worker): bound model archive bootstrap resources"
          git push origin HEAD:automation/worker-lease-fencing-20260911
