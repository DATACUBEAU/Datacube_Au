name: Worker Lockfile Remediation

on:
  push:
    branches:
      - automation/worker-lease-fencing-20260911
    paths:
      - 'rag-worker/package.json'
      - 'backend/rag-worker/package.json'
      - '.github/workflows/worker-lockfile-remediation.yml'

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: automation/worker-lease-fencing-20260911
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            rag-worker/package-lock.json
            backend/rag-worker/package-lock.json

      - name: Regenerate npm lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --prefix rag-worker
          npm install --package-lock-only --ignore-scripts --prefix backend/rag-worker

      - name: Validate root worker frozen install, build and tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix rag-worker
          npm run build --prefix rag-worker
          npm test --prefix rag-worker -- --runInBand
          npm audit --prefix rag-worker --omit=dev --audit-level=critical

      - name: Validate backend worker frozen install, build and tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix backend/rag-worker
          npm run build --prefix backend/rag-worker
          npm test --prefix backend/rag-worker -- --runInBand
          npm audit --prefix backend/rag-worker --omit=dev --audit-level=critical

      - name: Commit npm-generated lockfiles and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'datacube-au-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add rag-worker/package-lock.json backend/rag-worker/package-lock.json
          git rm .github/workflows/worker-lockfile-remediation.yml
          git diff --cached --check
          git commit -m 'fix(worker): commit validated patched dependency lockfiles'
          git push origin HEAD:automation/worker-lease-fencing-20260911
