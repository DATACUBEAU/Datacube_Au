name: Native Android
on:
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android-native.yml"]
  push:
    branches: [main]
    paths: ["apps/android/**", ".github/workflows/android-native.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
      - name: Build debug APK
        run: gradle -p apps/android :app:assembleDebug --no-daemon
