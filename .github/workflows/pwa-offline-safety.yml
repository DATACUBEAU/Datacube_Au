name: PWA Offline Safety

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-offline-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pwa-offline-safety:
    name: Protected cache, offline entitlement, and upload isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: PWA and offline integrity tests
        run: pnpm test:pwa-offline
