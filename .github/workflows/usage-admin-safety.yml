name: Usage Admin Safety

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usage-admin-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  usage-admin-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile admin usage safety regressions
        run: >-
          pnpm exec tsc
          --skipLibCheck
          --module commonjs
          --target es2022
          --moduleResolution node
          --esModuleInterop
          --outDir .tmp-tests
          tests/admin-usage-adjustments.unit.test.ts
          tests/admin-usage-idempotency-sql.unit.test.ts
          tests/admin-usage-concurrency-sql.unit.test.ts
          tests/admin-usage-api-error-safety.unit.test.ts
          tests/admin-usage-inflight-reservation.unit.test.ts
          tests/simple-plan-rule-atomicity.unit.test.ts
          tests/conex-usage-selection-race.unit.test.ts
          tests/document-owner-usage-version.unit.test.ts
          tests/ai-usage-window-scope.unit.test.ts
          tests/ai-usage-commit-window.unit.test.ts
          tests/ai-usage-window-freshness.unit.test.ts
          tests/usage-event-mutation-version.unit.test.ts
          tests/usage-admin-adjustment-error-safety.unit.test.ts
          src/lib/server/usage-tracking.ts
          src/lib/server/ai-usage-accounting.ts
          src/lib/limits/plan-limit-model.ts
          shared/usage-metrics.ts

      - name: Run admin usage safety regressions
        run: |
          node -e "require('node:fs').writeFileSync('.tmp-tests/package.json', '{\"type\":\"commonjs\"}')"
          node .tmp-tests/tests/admin-usage-adjustments.unit.test.js
          node .tmp-tests/tests/admin-usage-idempotency-sql.unit.test.js
          node .tmp-tests/tests/admin-usage-concurrency-sql.unit.test.js
          node .tmp-tests/tests/admin-usage-api-error-safety.unit.test.js
          node .tmp-tests/tests/admin-usage-inflight-reservation.unit.test.js
          node .tmp-tests/tests/simple-plan-rule-atomicity.unit.test.js
          node .tmp-tests/tests/conex-usage-selection-race.unit.test.js
          node .tmp-tests/tests/document-owner-usage-version.unit.test.js
          node .tmp-tests/tests/ai-usage-window-scope.unit.test.js
          node .tmp-tests/tests/ai-usage-commit-window.unit.test.js
          node .tmp-tests/tests/ai-usage-window-freshness.unit.test.js
          node .tmp-tests/tests/usage-event-mutation-version.unit.test.js
          node .tmp-tests/tests/usage-admin-adjustment-error-safety.unit.test.js
