name: Supabase Migration Chain

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # config.toml references these through env(...). The related services are
      # not used by this schema-only gate, so non-secret CI placeholders are sufficient.
      OPENAI_API_KEY: ci-placeholder
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-placeholder
      S3_HOST: ci-placeholder.invalid
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local PostgreSQL
        run: supabase db start

      - name: Rebuild schema from migrations
        run: supabase db reset --local --no-seed

      - name: Lint migrated public schema
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: Stop local Supabase resources
        if: always()
        run: supabase stop --no-backup
