name: Supabase Migration Chain

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # config.toml references these through env(...). The related services are
      # not used by this schema-only gate, so non-secret CI placeholders are sufficient.
      OPENAI_API_KEY: ci-placeholder
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-placeholder
      S3_HOST: ci-placeholder.invalid
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start minimal local Supabase stack
        shell: bash
        run: |
          set -o pipefail
          supabase start \
            --exclude logflare \
            --exclude vector \
            --exclude kong \
            --exclude mailpit \
            --exclude realtime \
            --exclude postgrest \
            --exclude imgproxy \
            --exclude edge-runtime \
            --exclude postgres-meta \
            --exclude studio \
            --exclude supavisor \
            --debug 2>&1 | tee /tmp/supabase-start.log

      - name: Capture startup diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '## Docker containers'
            docker ps -a || true
            echo
            echo '## Supabase status'
            supabase status --debug || true
            echo
            echo '## Supabase start output'
            cat /tmp/supabase-start.log || true
            echo
            echo '## Supabase container logs'
            for id in $(docker ps -aq --filter 'name=supabase'); do
              echo "### $id ($(docker inspect --format '{{.Name}}' "$id" 2>/dev/null || true))"
              docker logs --tail 200 "$id" 2>&1 || true
            done
          } | tee /tmp/supabase-start-diagnostics.log

      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-startup-diagnostics
          path: |
            /tmp/supabase-start.log
            /tmp/supabase-start-diagnostics.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rebuild schema from migrations
        run: supabase db reset --local --no-seed

      - name: Lint migrated public schema
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: Stop local Supabase resources
        if: always()
        run: supabase stop --no-backup
