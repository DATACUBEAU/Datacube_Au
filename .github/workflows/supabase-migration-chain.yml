name: Supabase Migration Chain

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # config.toml references these through env(...). The related services are
      # not used by this schema-only gate, so non-secret CI placeholders are sufficient.
      OPENAI_API_KEY: ci-placeholder
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-placeholder
      S3_HOST: ci-placeholder.invalid
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Start minimal local Supabase stack
        shell: bash
        run: |
          set -o pipefail
          supabase start \
            --exclude logflare \
            --exclude vector \
            --exclude mailpit \
            --exclude realtime \
            --exclude imgproxy \
            --exclude edge-runtime \
            --exclude postgres-meta \
            --exclude studio \
            --exclude supavisor \
            --debug 2>&1 | tee /tmp/supabase-start.log

      - name: Capture startup diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '## Docker containers'
            docker ps -a || true
            echo
            echo '## Supabase status'
            supabase status --debug || true
            echo
            echo '## Supabase start output'
            cat /tmp/supabase-start.log || true
            echo
            echo '## Supabase container logs'
            for id in $(docker ps -aq --filter 'name=supabase'); do
              echo "### $id ($(docker inspect --format '{{.Name}}' "$id" 2>/dev/null || true))"
              docker logs --tail 200 "$id" 2>&1 || true
            done
          } | tee /tmp/supabase-start-diagnostics.log

      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-startup-diagnostics
          path: |
            /tmp/supabase-start.log
            /tmp/supabase-start-diagnostics.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rebuild schema from migrations
        run: supabase db reset --local --no-seed

      - name: Lint migrated public schema
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: Install web dependencies for the mobile auth integration test
        run: pnpm install --frozen-lockfile

      - name: Test mobile authorization with isolated Supabase Auth and Postgres
        shell: bash
        run: |
          psql -X -v ON_ERROR_STOP=1 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -f supabase/tests/mobile_device_authorization.sql
          config=$(supabase status --output json)
          DATACUBE_TEST_SUPABASE_URL=$(jq -er '.API_URL' <<< "$config")
          DATACUBE_TEST_SUPABASE_PUBLIC_KEY=$(jq -er '.ANON_KEY // .PUBLISHABLE_KEY' <<< "$config")
          DATACUBE_TEST_SUPABASE_SERVICE_KEY=$(jq -er '.SERVICE_ROLE_KEY // .SECRET_KEY' <<< "$config")
          export DATACUBE_TEST_SUPABASE_URL DATACUBE_TEST_SUPABASE_PUBLIC_KEY DATACUBE_TEST_SUPABASE_SERVICE_KEY
          export DATACUBE_TEST_WEB_URL=http://127.0.0.1:3000
          export NEXT_PUBLIC_SUPABASE_URL="$DATACUBE_TEST_SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$DATACUBE_TEST_SUPABASE_PUBLIC_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$DATACUBE_TEST_SUPABASE_SERVICE_KEY"
          pnpm exec next dev --webpack --hostname 127.0.0.1 --port 3000 > /tmp/mobile-auth-next.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 --silent --show-error "$DATACUBE_TEST_WEB_URL/.well-known/assetlinks.json" > /dev/null
          node tests/mobile-device-authorization.integration.mjs

      - name: Stop local Supabase resources
        if: always()
        run: supabase stop --no-backup
