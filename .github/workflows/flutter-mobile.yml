name: Flutter mobile foundation

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-mobile.yml"

jobs:
  android-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold if absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.datacubeau --project-name datacube_au .
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
