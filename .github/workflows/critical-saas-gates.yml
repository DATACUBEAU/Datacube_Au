name: Critical SaaS Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-saas-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  critical-gates:
    name: Typecheck, lint, security, billing, usage and UX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Protected API security tests
        run: pnpm test:protected-api-pipeline

      - name: Auth state hardening tests
        run: pnpm test:auth-state-hardening

      - name: Usage metering tests
        run: pnpm test:limits-usage

      - name: Atomic usage accounting tests
        run: pnpm test:atomic-usage

      - name: AI idempotency boundary tests
        run: pnpm exec tsx tests/ai-idempotency-boundary.unit.test.ts

      - name: Billing subscription state tests
        run: pnpm test:billing-subscription-state

      - name: Billing pipeline tests
        run: pnpm test:billing-pipeline

      - name: Account snapshot and plan state tests
        run: pnpm test:account-snapshot-state

      - name: User-facing error recovery tests
        run: pnpm test:user-facing-error

      - name: Responsive onboarding tests
        run: pnpm test:onboarding-responsive

      - name: UI freeze prevention tests
        run: pnpm test:ui-freeze-prevention
