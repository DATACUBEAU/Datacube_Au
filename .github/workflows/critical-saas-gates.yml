name: Critical SaaS Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-saas-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  critical-gates:
    name: Typecheck, lint, security, billing, usage and UX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Protected API security tests
        run: pnpm test:protected-api-pipeline

      - name: Auth state hardening tests
        run: pnpm test:auth-state-hardening

      - name: Usage metering tests
        run: pnpm test:limits-usage

      - name: Atomic usage accounting tests
        run: pnpm test:atomic-usage

      - name: AI idempotency boundary tests
        run: |
          pnpm exec tsc --skipLibCheck --module commonjs --target es2020 --moduleResolution node --esModuleInterop --outDir .tmp-tests tests/ai-idempotency-boundary.unit.test.ts src/lib/server/ai-usage-accounting.ts src/lib/server/usage-tracking.ts src/lib/server/vps-ticket-config.ts src/lib/limits/plan-limit-model.ts src/lib/tier/policy.ts shared/usage-metrics.ts
          node -e "const fs=require('node:fs'); fs.mkdirSync('.tmp-tests/shared', {recursive:true}); fs.copyFileSync('shared/ai-gateway-contract.cjs', '.tmp-tests/shared/ai-gateway-contract.cjs'); fs.writeFileSync('.tmp-tests/package.json', '{\"type\":\"commonjs\"}')"
          node .tmp-tests/tests/ai-idempotency-boundary.unit.test.js

      - name: Billing subscription state tests
        run: pnpm test:billing-subscription-state

      - name: Billing pipeline tests
        run: pnpm test:billing-pipeline

      - name: Account snapshot and plan state tests
        run: pnpm test:account-snapshot-state

      - name: User-facing error recovery tests
        run: pnpm test:user-facing-error

      - name: Responsive onboarding tests
        run: pnpm test:onboarding-responsive

      - name: UI freeze prevention tests
        run: pnpm test:ui-freeze-prevention
