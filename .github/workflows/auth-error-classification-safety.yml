name: Auth Error Classification Safety

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-error-classification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-error-classification:
    name: Preserve 401, 403, and infrastructure error boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Auth error classification tests
        run: |
          pnpm exec tsc --skipLibCheck --module commonjs --target es2020 --moduleResolution node --esModuleInterop --outDir .tmp-tests tests/auth-error-classification.unit.test.ts src/lib/auth/auth-error-classification.ts src/lib/api/api-contract.ts
          node -e "require('node:fs').writeFileSync('.tmp-tests/package.json', '{\"type\":\"commonjs\"}')"
          node .tmp-tests/tests/auth-error-classification.unit.test.js
