name: Production Mobile Authorization Smoke

on:
  push:
    branches: [fix/android-hybrid-auth, fix/auth-exchange-transport]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-and-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify deployed device authorization API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes, createHash } from 'node:crypto';
          import assert from 'node:assert/strict';

          const endpoint = 'https://datacube.fabianodev.xyz/api/auth/mobile-authorization';
          const verifier = randomBytes(32).toString('base64url');
          const challenge = createHash('sha256').update(verifier, 'ascii').digest('base64url');

          async function request(body) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify(body),
              redirect: 'manual',
              signal: AbortSignal.timeout(15_000),
            });
            let payload = {};
            try { payload = await response.json(); } catch {}
            console.log('Mobile authorization API: HTTP ' + response.status + ' / ' + String(payload.code ?? payload.status ?? 'no-json-code'));
            if (!response.ok || payload.ok !== true) {
              throw new Error('Mobile authorization API did not accept ' + body.action + ' (HTTP ' + response.status + ', code ' + String(payload.code ?? 'unknown') + ')');
            }
            return payload;
          }
          const created = await request({ action: 'create', challenge });
          assert.match(created.requestId, /^[A-Za-z0-9_-]{43}$/);
          assert.match(created.pairingCode, /^[A-Z2-9]{8}$/);
          try {
            const cancelled = await request({ action: 'cancel', requestId: created.requestId, verifier });
            assert.equal(cancelled.status, 'cancelled');
          } finally {
            console.log('Smoke test finished; no Supabase user session was created.');
          }
          NODE

  browser-auth-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live Supabase CORS with existing SDK headers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://dhmukdeljiwvvwjdcxgn.supabase.co/auth/v1/token?grant_type=pkce';
          const origin = 'https://datacube.fabianodev.xyz';
          const standard = ['apikey','authorization','content-type','x-client-info','x-supabase-api-version'];
          for (const headers of [standard, [...standard,'x-device-id'], [...standard,'x-device-id','x-supabase-client-platform','x-supabase-client-platform-version','x-supabase-client-runtime','x-supabase-client-runtime-version']]) {
            const res = await fetch(url, {method:'OPTIONS', headers:{Origin:origin,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':headers.join(',')}, redirect:'manual', signal:AbortSignal.timeout(12000)});
            const allowed = (res.headers.get('access-control-allow-headers') || '').toLowerCase().split(',').map(v=>v.trim());
            const missing = headers.filter(h=>!allowed.includes(h) && !(allowed.includes('*') && h!=='authorization'));
            console.log(JSON.stringify({variant:headers.includes('x-supabase-client-platform')?'sdk-2.93.1':headers.includes('x-device-id')?'custom':'standard',status:res.status,origin:res.headers.get('access-control-allow-origin'),missing,allowMethods:res.headers.get('access-control-allow-methods')}));
          }
          NODE

      - name: Inspect published SDK patch metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['supabase-js','auth-js','functions-js','postgrest-js','realtime-js','storage-js']) {
            const res=await fetch('https://registry.npmjs.org/@supabase%2f'+name+'/2.98.0');
            if(!res.ok) throw new Error('Metadata unavailable: '+name+' '+res.status);
            const p=await res.json();
            console.log(JSON.stringify({name:p.name,version:p.version,integrity:p.dist.integrity,engines:p.engines,dependencies:p.dependencies,peerDependencies:p.peerDependencies}));
          }
          NODE
