name: Direct Android ARM64 APK

# The main Android pipeline runs unit tests, lint, a release-bundle build
# and emulator tests first. Only a passing main-branch run publishes a direct
# downloadable APK; this is never a ZIP-style GitHub Actions artifact.
on:
  workflow_run:
    workflows: ["Native Android"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-direct-apk-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'DATACUBEAU/Datacube_Au' &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # These are public client settings, never a server service-role key.
      SUPABASE_URL: https://dhmukdeljiwvvwjdcxgn.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_6N4nuBJIaXzOVYYUXSzomA_R8TB1vc_
      AUTH_WEBSITE_URL: https://datacube-au.vercel.app
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Check out the exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # Use the existing registered debug certificate when the secret is present.
      - name: Restore verified personal test signer if configured
        shell: bash
        env:
          PERSONAL_KEYSTORE: ${{ secrets.ANDROID_PERSONAL_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$PERSONAL_KEYSTORE" ]]; then
            echo "SIGNING_KIND=temporary CI debug certificate" >> "$GITHUB_ENV"
            echo "Registered test signer unavailable; browser App Links may not verify." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          path="$RUNNER_TEMP/datacube-personal-debug.keystore"
          printf '%s' "$PERSONAL_KEYSTORE" | base64 --decode > "$path"
          actual=$(keytool -exportcert -keystore "$path" -alias androiddebugkey -storepass android |
            sha1sum | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')
          if [[ "$actual" != "DF81CB825B6FA1C414A74AAFC4199E0C9BB704FC" ]]; then
            echo "::error::Personal signer does not match the registered Android test certificate."
            exit 1
          fi
          echo "ANDROID_PERSONAL_DEBUG_KEYSTORE_PATH=$path" >> "$GITHUB_ENV"
          echo "SIGNING_KIND=persistent registered Android test certificate" >> "$GITHUB_ENV"
          echo "Personal signer identity verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Android application
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> local.properties
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> local.properties
          printf 'AUTH_WEBSITE_URL=%s\n' "$AUTH_WEBSITE_URL" >> local.properties

      - name: Build smaller ARM64 APK only
        run: bash ./gradlew :app:assembleDebug -PdatacubeArm64Only=true --no-daemon

      - name: Verify APK signing, ABI and actual uncompressed APK size
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose "$apk"
          mapfile -t abis < <(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF >= 3 {print $2}' | sort -u)
          if [[ "${#abis[@]}" -ne 1 || "${abis[0]}" != "arm64-v8a" ]]; then
            echo "::error::Expected only ARM64 native libraries. Found: ${abis[*]:-none}"
            exit 1
          fi
          if [[ -n "${ANDROID_PERSONAL_DEBUG_KEYSTORE_PATH:-}" ]]; then
            certs=$("$signer" verify --print-certs "$apk")
            echo "$certs" | grep -iq 'DF81CB825B6FA1C414A74AAFC4199E0C9BB704FC' || {
              echo "::error::Built APK signer did not match the expected registered certificate."
              exit 1
            }
          fi
          bytes=$(stat -c%s "$apk")
          size_mib=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / (1024 * 1024) }')
          echo "APK size: ${size_mib} MiB (${bytes} bytes)" >> "$GITHUB_STEP_SUMMARY"
          echo "Architecture: arm64-v8a; Android 8.0+; no AI model weights. Signer: $SIGNING_KIND." >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/datacube-direct-apk"
          cp "$apk" "$RUNNER_TEMP/datacube-direct-apk/DataCube-AU-Android-arm64.apk"
          sha256sum "$RUNNER_TEMP/datacube-direct-apk/DataCube-AU-Android-arm64.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish direct APK as clearly labeled prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="android-test-${EXPECTED_SHA:0:12}"
          apk="$RUNNER_TEMP/datacube-direct-apk/DataCube-AU-Android-arm64.apk"
          message="ARM64-only debug APK for compatible Android 8.0+ phones. Direct APK, not an artifact ZIP. No AI models included or downloaded automatically. Signer: $SIGNING_KIND. Existing installations signed with a different certificate cannot be updated in place. Browser sign-in requires the registered certificate. Not a production release."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" \
              --target "$EXPECTED_SHA" --title "DataCube AU ARM64 test (${EXPECTED_SHA:0:12})" \
              --notes "$message" --prerelease
          fi
          echo "Direct APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/DataCube-AU-Android-arm64.apk" >> "$GITHUB_STEP_SUMMARY"
