name: Android Browser Login Live Smoke

on:
  push:
    branches: [fix/android-hybrid-auth]
    paths:
      - "apps/android/app/src/androidTest/java/au/datacube/app/auth/LiveBrowserLoginSmokeTest.kt"
      - ".github/workflows/android-browser-login-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tap-and-create:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - name: Configure test client
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "SUPABASE_URL=https://fixture.invalid" >> local.properties
          echo "SUPABASE_ANON_KEY=fixture-public" >> local.properties
          echo "AUTH_WEBSITE_URL=https://datacube-au.vercel.app" >> local.properties
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
      - name: Tap real Android UI against live Vercel API
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: apps/android
          disable-animations: true
          script: >-
            bash ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=au.datacube.app.auth.LiveBrowserLoginSmokeTest
            --no-daemon
      - name: Upload diagnostic test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-live-browser-login-smoke-reports
          path: |
            apps/android/app/build/reports/androidTests/connected/**
            apps/android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 5
