name: Strix Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strix-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strix-security-scan:
    name: Strix source security scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Strix LLM configuration
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LLM_API_KEY:-}" ]; then
            echo "LLM_API_KEY is not configured for Strix. Add a dedicated GitHub Actions secret named LLM_API_KEY before this scan can execute."
            exit 2
          fi
          if [ -z "${STRIX_LLM:-}" ]; then
            echo "STRIX_LLM is not configured; using Strix's documented OpenAI model default for this workflow."
          fi

      - name: Install Strix
        run: curl -fsSL https://strix.ai/install | bash

      - name: Run Strix non-destructive source scan
        id: strix
        continue-on-error: true
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM || 'openai/gpt-5.4' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set +e
          strix -n \
            --target ./ \
            --scan-mode quick \
            --scope-mode diff \
            --diff-base origin/main \
            --instruction "Authorized, non-destructive security review of the Datacube AU source tree only. Do not target deployed production systems or external services. Focus on authentication/authorization bypass, tenant isolation/IDOR, Supabase/RLS trust boundaries, billing and usage-metering manipulation, upload/worker ingestion, SSRF/file parsing, RAG/document access leakage, secret exposure, unsafe redirects, and privilege escalation. Validate findings against local source evidence and avoid destructive exploitation."
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload Strix results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-security-results
          path: strix_runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Strix result
        if: always()
        env:
          STRIX_EXIT_CODE: ${{ steps.strix.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ -z "${STRIX_EXIT_CODE:-}" ]; then
            echo "Strix did not run to completion. Review the earlier workflow steps."
            exit 1
          fi
          if [ "$STRIX_EXIT_CODE" -ne 0 ]; then
            echo "Strix exited with code $STRIX_EXIT_CODE. Review the uploaded Strix results before merging."
            exit "$STRIX_EXIT_CODE"
          fi
          echo "Strix completed without a blocking finding."
